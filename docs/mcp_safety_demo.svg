<svg xmlns="http://www.w3.org/2000/svg" width="742" height="381" viewBox="0 0 742 381" role="img" aria-label="apyrobo mcp on mock://: a move runs, an over-limit move is clamped, a no-go move is refused">
<title>apyrobo mcp on mock://: a move runs, an over-limit move is clamped, a no-go move is refused</title>
<style>text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}.prompt{fill:#e6edf3}.call{fill:#79c0ff}.ran{fill:#3fb950}.clamped{fill:#d29922}.refused{fill:#ff7b72}.title{fill:#8b949e;font-size:12px}@keyframes b0{0%,4.62%{opacity:0}5.12%,97%{opacity:1}100%{opacity:0}}.b0{animation:b0 13.0s linear infinite}@keyframes b1{0%,16.92%{opacity:0}17.42%,97%{opacity:1}100%{opacity:0}}.b1{animation:b1 13.0s linear infinite}@keyframes b2{0%,29.23%{opacity:0}29.73%,97%{opacity:1}100%{opacity:0}}.b2{animation:b2 13.0s linear infinite}@keyframes b3{0%,41.54%{opacity:0}42.04%,97%{opacity:1}100%{opacity:0}}.b3{animation:b3 13.0s linear infinite}@keyframes b4{0%,53.85%{opacity:0}54.35%,97%{opacity:1}100%{opacity:0}}.b4{animation:b4 13.0s linear infinite}@media (prefers-reduced-motion:reduce){g{animation:none!important}}</style>
<rect width="742" height="381" rx="8" fill="#0d1117"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="371.0" y="21" text-anchor="middle" class="title">examples/05_mcp_safety_demo.py</text>
<g class="b0">
<text x="18" y="66" class="prompt">$ apyrobo mcp --robot mock://turtlebot4 --max-speed 0.5 --no-go 2,2,4,4</text>
</g>
<g class="b1">
<text x="18" y="108" class="call">&gt; move_to {"x": 1.0, "y": 0.0, "speed": 0.3}</text>
<text x="18" y="129" class="ran">  moved, robot at (1.0, 0.0)</text>
</g>
<g class="b2">
<text x="18" y="171" class="call">&gt; move_to {"x": 2.0, "y": 0.0, "speed": 5.0}</text>
<text x="18" y="192" class="ran">  moved, robot at (2.0, 0.0)</text>
<text x="18" y="213" class="clamped">  speed_clamped: requested 5.0 m/s, enforced 0.5 m/s</text>
</g>
<g class="b3">
<text x="18" y="255" class="call">&gt; move_to {"x": 3.0, "y": 3.0}</text>
<text x="18" y="276" class="refused">  REFUSED by safety policy 'default+cli': Position (3, 3) is inside collision zone</text>
<text x="18" y="297" class="refused">  (x 2 to 4, y 2 to 4). The robot did not move. Choose a different target.</text>
</g>
<g class="b4">
<text x="18" y="339" class="call">&gt; stop</text>
<text x="18" y="360" class="ran">  stopped, robot at (2.0, 0.0)</text>
</g>
</svg>
