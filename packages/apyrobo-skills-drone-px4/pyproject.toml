[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "apyrobo-skills-drone-px4"
version = "1.0.0"
description = "PX4-based drone skill pack for APYROBO"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "APYROBO Contributors" }]
keywords = ["robotics", "drone", "px4", "uav", "apyrobo", "skills"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "apyrobo>=1.0.0",
]

[project.entry-points."apyrobo.skills"]
px4 = "apyrobo_skills_drone_px4:register"

[project.urls]
Homepage = "https://github.com/apyrobo/Apyrobo"
Repository = "https://github.com/apyrobo/Apyrobo/tree/main/packages/apyrobo-skills-drone-px4"

[tool.setuptools.packages.find]
where = ["."]
include = ["apyrobo_skills_drone_px4*"]
