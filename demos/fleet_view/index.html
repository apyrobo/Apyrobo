<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>APYROBO — Live Fleet View</title>
<style>
  :root {
    --bg: #14141f; --panel: #1c1c2b; --line: #2c2c40;
    --text: #d8d8e8; --dim: #8a8aa3; --accent: #7aa2f7;
    --ok: #9ece6a; --err: #f7768e; --warn: #e0af68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "SF Mono", ui-monospace, Menlo, monospace;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  #status { margin-left: auto; font-size: 12px; color: var(--warn); }
  #status.live { color: var(--ok); }
  main { display: flex; flex: 1; min-height: 0; }
  #world { flex: 1; position: relative; }
  canvas { width: 100%; height: 100%; display: block; }
  aside {
    width: 380px; border-left: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  form { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  form label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  input, select, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
  }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  button { background: var(--accent); color: #10101a; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #hint { font-size: 11px; color: var(--dim); }
  #log { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .evt { padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
  .evt .who { color: var(--dim); }
  .evt.planned .tag { color: var(--ok); }
  .evt.error .tag { color: var(--err); }
  .evt.sent .tag { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>APYROBO · Live Fleet View</h1>
  <span class="sub">wire protocol ws://127.0.0.1:8765 · rendered by the TypeScript reference client</span>
  <span id="status">connecting…</span>
</header>
<main>
  <div id="world"><canvas id="canvas"></canvas></div>
  <aside>
    <form id="taskForm">
      <label for="task">Task (try “deliver to the dock”, “inspect the kitchen”, “go to (20, 40)”)</label>
      <input id="task" autocomplete="off" placeholder="natural-language task…" required>
      <label for="robot">Robot</label>
      <select id="robot"></select>
      <button id="send" type="submit">Dispatch over wire protocol</button>
      <div id="hint">Plans come back as <code>status:"planned"</code>; positions stream as the
      extension status <code>"telemetry"</code>, which spec-1.0 clients simply ignore.</div>
    </form>
    <div id="log"></div>
  </aside>
</main>

<script type="module">
import { ApyroboClient, isPlanned, isError }
  from "/packages/apyrobo-client-ts/dist/index.js";

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const robotSel = document.getElementById("robot");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const state = {
  world: [100, 60],
  zones: {},
  robots: new Map(),   // id → {..., trail: [[x,y],…]}
};

function logEvent(kind, tag, text, who) {
  const div = document.createElement("div");
  div.className = `evt ${kind}`;
  div.innerHTML = `<span class="tag">${tag}</span> ${text}` +
    (who ? ` <span class="who">— ${who}</span>` : "");
  logEl.prepend(div);
  while (logEl.children.length > 40) logEl.lastChild.remove();
}

// ---------------------------------------------------------------------
// Wire protocol
// ---------------------------------------------------------------------
let client;
try {
  client = await ApyroboClient.connect("ws://127.0.0.1:8765");
  statusEl.textContent = "● live";
  statusEl.classList.add("live");
} catch (err) {
  statusEl.textContent = "connection failed — is server.py running?";
  throw err;
}

client.onMessage((msg) => {
  const status = msg.metadata?.status;
  if (status === "telemetry") {
    state.world = msg.metadata.world ?? state.world;
    state.zones = msg.metadata.zones ?? state.zones;
    for (const r of msg.metadata.robots ?? []) {
      const prev = state.robots.get(r.id) ?? { trail: [] };
      const trail = prev.trail;
      const last = trail[trail.length - 1];
      if (!last || Math.hypot(last[0] - r.x, last[1] - r.y) > 0.4) {
        trail.push([r.x, r.y]);
        if (trail.length > 120) trail.shift();
      }
      state.robots.set(r.id, { ...r, trail });
    }
    syncRobotSelect();
    return;
  }
  if (status === "planned") {
    const skills = (msg.metadata.skills ?? []).map(s => s.name).join(" → ");
    logEvent("planned", "PLANNED", `“${msg.task}” → ${skills || "(no steps)"}`,
             msg.robot_uri);
  } else if (status === "error") {
    logEvent("error", "ERROR", `“${msg.task}” — ${msg.metadata.error}`, msg.robot_uri);
  }
});

function syncRobotSelect() {
  const ids = [...state.robots.keys()].sort();
  if (robotSel.children.length === ids.length) return;
  const current = robotSel.value;
  robotSel.replaceChildren(...ids.map(id => new Option(id, id)));
  if (ids.includes(current)) robotSel.value = current;
}

document.getElementById("taskForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const task = document.getElementById("task").value.trim();
  const robotUri = `mock://${robotSel.value}`;
  if (!task) return;
  const btn = document.getElementById("send");
  btn.disabled = true;
  logEvent("sent", "SENT", `“${task}”`, robotUri);
  try {
    const res = await client.submitTask(task, { robotUri, timeoutMs: 15000 });
    if (isError(res)) console.warn("plan error:", res.metadata.error);
  } catch (err) {
    logEvent("error", "ERROR", String(err));
  } finally {
    btn.disabled = false;
    document.getElementById("task").value = "";
  }
});

// ---------------------------------------------------------------------
// Canvas rendering
// ---------------------------------------------------------------------
function resize() {
  const box = canvas.parentElement.getBoundingClientRect();
  canvas.width = box.width * devicePixelRatio;
  canvas.height = box.height * devicePixelRatio;
}
addEventListener("resize", resize);
resize();

function draw() {
  requestAnimationFrame(draw);
  const [W, H] = state.world;
  const w = canvas.width, h = canvas.height;
  const scale = Math.min(w / W, h / H) * 0.94;
  const ox = (w - W * scale) / 2, oy = (h - H * scale) / 2;
  const px = (x, y) => [ox + x * scale, oy + y * scale];

  ctx.clearRect(0, 0, w, h);

  // world frame + grid
  ctx.strokeStyle = "#22223400";
  ctx.fillStyle = "#181826";
  ctx.fillRect(ox, oy, W * scale, H * scale);
  ctx.strokeStyle = "#242438";
  ctx.lineWidth = 1;
  for (let gx = 0; gx <= W; gx += 10) {
    const [X] = px(gx, 0);
    ctx.beginPath(); ctx.moveTo(X, oy); ctx.lineTo(X, oy + H * scale); ctx.stroke();
  }
  for (let gy = 0; gy <= H; gy += 10) {
    const [, Y] = px(0, gy);
    ctx.beginPath(); ctx.moveTo(ox, Y); ctx.lineTo(ox + W * scale, Y); ctx.stroke();
  }

  // zones
  ctx.font = `${11 * devicePixelRatio}px ui-monospace`;
  for (const [name, [zx, zy]] of Object.entries(state.zones)) {
    const [X, Y] = px(zx, zy);
    ctx.strokeStyle = "#3a3a55";
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(X, Y, 3.2 * scale, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#5a5a7a";
    ctx.textAlign = "center";
    ctx.fillText(name.toUpperCase(), X, Y + 4.6 * scale);
  }

  // robots
  for (const r of state.robots.values()) {
    const color = r.kind === "drone" ? "#7aa2f7" : "#9ece6a";
    // trail
    if (r.trail.length > 1) {
      ctx.strokeStyle = color + "44";
      ctx.lineWidth = 1.5 * devicePixelRatio;
      ctx.beginPath();
      r.trail.forEach(([tx, ty], i) => {
        const [X, Y] = px(tx, ty);
        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      });
      ctx.stroke();
    }
    // target line
    if (r.target) {
      const [X, Y] = px(r.x, r.y);
      const [TX, TY] = px(r.target[0], r.target[1]);
      ctx.strokeStyle = color + "55";
      ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(TX, TY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = color + "99";
      ctx.beginPath(); ctx.arc(TX, TY, 4 * devicePixelRatio, 0, Math.PI * 2); ctx.stroke();
    }
    // body
    const [X, Y] = px(r.x, r.y);
    ctx.save();
    ctx.translate(X, Y);
    ctx.rotate(r.heading);
    ctx.fillStyle = color;
    const s = 6 * devicePixelRatio;
    if (r.kind === "drone") {
      ctx.beginPath();
      ctx.moveTo(1.6 * s, 0); ctx.lineTo(-s, 0.9 * s); ctx.lineTo(-s, -0.9 * s);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.roundRect(-s, -0.8 * s, 2 * s, 1.6 * s, 3);
      ctx.fill();
      ctx.fillStyle = "#10101a";
      ctx.fillRect(0.35 * s, -0.5 * s, 0.4 * s, s);
    }
    ctx.restore();
    // label + task
    ctx.textAlign = "center";
    ctx.fillStyle = "#c8c8dd";
    ctx.fillText(r.id, X, Y - 12 * devicePixelRatio);
    if (r.task) {
      ctx.fillStyle = "#6a6a88";
      ctx.fillText(r.task.slice(0, 34), X, Y + 20 * devicePixelRatio);
    }
  }
}
draw();
</script>
</body>
</html>
