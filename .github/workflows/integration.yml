name: ROS 2 Integration Tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same ref when a new one starts.
concurrency:
  group: ros2-integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros2-integration:
    name: ROS 2 Adapter Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build the integration image.
      # We intentionally skip tar-based image caching: loading a stale image
      # via docker load can cause Docker to reuse old layers and miss apt
      # package changes (e.g. ros-humble-rclpy submodule updates).
      # BuildKit layer caching via the Docker daemon still applies.
      - name: Build integration image
        run: docker compose -f docker/docker-compose.yml --profile integration build
        env:
          DOCKER_BUILDKIT: 1

      # --exit-code-from propagates pytest's exit code to this step.
      # It implies --abort-on-container-exit, so the fake-robot service is
      # stopped as soon as the integration-test container finishes.
      - name: Run integration tests
        run: |
          docker compose -f docker/docker-compose.yml --profile integration \
            up \
            --abort-on-container-exit \
            --exit-code-from integration-test
        env:
          DOCKER_BUILDKIT: 1

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --profile integration logs

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml --profile integration down --volumes

  # Real-physics proof: the same ros2:// adapter, driven against a
  # TurtleBot3 in headless Gazebo Classic (not the kinematic fake robot).
  # Gazebo-in-CI is heavy; a generous timeout guards against hung boots.
  gazebo-integration:
    name: Gazebo TurtleBot3 Integration
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Build Gazebo image
        run: docker compose -f docker/docker-compose.yml --profile gazebo build
        env:
          DOCKER_BUILDKIT: 1

      - name: Run Gazebo integration test
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo \
            up \
            --abort-on-container-exit \
            --exit-code-from gazebo-test
        env:
          DOCKER_BUILDKIT: 1

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo logs

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo down --volumes

  # Flagship-stack end-to-end: natural-language task → rule-agent plan →
  # Nav2 NavigateToPose → the physics-simulated TurtleBot3 navigates.
  # SLAM + Nav2 bringup on top of Gazebo is the heaviest job here — the
  # compose healthcheck waits for the navigate_to_pose action server and
  # the job timeout guards against hung bringups.
  gazebo-nav-e2e:
    name: Nav2-in-Gazebo NL End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Build Gazebo image
        run: docker compose -f docker/docker-compose.yml --profile gazebo-nav build
        env:
          DOCKER_BUILDKIT: 1

      - name: Run Nav2 end-to-end test
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo-nav \
            up \
            --abort-on-container-exit \
            --exit-code-from gazebo-nav-test
        env:
          DOCKER_BUILDKIT: 1

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo-nav logs

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo-nav down --volumes

  # Cross-language interop showcase (demos/ts_interop): `apyrobo serve
  # --execute` runs inside the Gazebo container speaking WebSocket, and the
  # reference TypeScript client drives the physics robot from the runner —
  # nothing crosses the boundary but spec-1.0 JSON.
  gazebo-nav-interop:
    name: TypeScript Client × Nav2-in-Gazebo Interop
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build TypeScript client
        working-directory: packages/apyrobo-client-ts
        run: |
          npm install
          npm run build

      - name: Build Gazebo image
        run: docker compose -f docker/docker-compose.yml --profile gazebo-nav-interop build
        env:
          DOCKER_BUILDKIT: 1

      # Naming the service scopes `up` to it + its dependency (the sim);
      # profile-less services would otherwise start too.
      - name: Start sim + wire-protocol server
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo-nav-interop \
            up -d gazebo-nav-serve
        env:
          DOCKER_BUILDKIT: 1

      # No port polling: Docker's proxy accepts TCP before the server is
      # really up, so the demo retries the WebSocket handshake itself
      # (--connect-timeout) while SLAM + Nav2 + discovery boot.
      - name: Drive the robot from TypeScript
        run: |
          node demos/ts_interop/demo.mjs \
            --ws ws://localhost:8765 \
            --robot ros2://burger \
            --task "navigate to (-1.2, -0.5)" \
            --connect-timeout 1500000 \
            --timeout 300000

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo-nav-interop logs

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo-nav-interop down --volumes
