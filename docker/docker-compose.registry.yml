# =============================================================================
# APYROBO Skill Registry — standalone deployment
#
# Quick start (development):
#   docker compose -f docker/docker-compose.registry.yml up
#
# Production (with nginx reverse proxy):
#   docker compose -f docker/docker-compose.registry.yml --profile production up -d
#
# Registry will be available at http://localhost:8080
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Skill registry API
  # ---------------------------------------------------------------------------
  registry:
    build:
      context: ..
      dockerfile: docker/Dockerfile.registry
    image: apyrobo-registry:latest
    container_name: apyrobo-registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-8080}:8080"
    environment:
      REGISTRY_DB_PATH: /data/registry.db
      APYROBO_REGISTRY_TOKEN: ${APYROBO_REGISTRY_TOKEN:-}
    volumes:
      - registry_data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # nginx reverse proxy — production only (docker compose --profile production)
  # ---------------------------------------------------------------------------
  registry-nginx:
    image: nginx:alpine
    profiles: ["production"]
    container_name: apyrobo-registry-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/registry.conf:/etc/nginx/conf.d/default.conf:ro
      - registry_certs:/etc/nginx/certs:ro
    depends_on:
      - registry

volumes:
  registry_data:
    driver: local
  registry_certs:
    driver: local
