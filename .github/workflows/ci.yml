# CI-05: Docker-based CI job — runs full test suite inside apyrobo container
# CI-12: mypy type checking in CI (strict mode)
name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # CI-05: Unit + integration tests inside Docker container
  # ------------------------------------------------------------------
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm,mujoco]"
          pip install hypothesis pytest-timeout

      - name: Run tests
        run: |
          python -m pytest tests/ \
            -m "not integration" \
            --cov=apyrobo \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v \
            --timeout=120

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ------------------------------------------------------------------
  # Bare-install guard: the kernel must work with zero optional deps,
  # and LLM entry points must degrade with an install hint
  # (docs/core_split_plan.md)
  # ------------------------------------------------------------------
  bare-install:
    name: Bare install smoke test (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with no extras
        run: pip install .

      - name: Run smoke test
        run: python scripts/bare_install_smoke.py

  # ------------------------------------------------------------------
  # Reference TypeScript client: build, unit tests, and cross-language
  # integration against the real `apyrobo serve` over stdio
  # ------------------------------------------------------------------
  ts-client:
    name: TypeScript client (build + cross-language tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/apyrobo-client-ts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install apyrobo (reference server)
        run: pip install "$GITHUB_WORKSPACE"

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Run tests (unit + integration vs apyrobo serve)
        run: npm test
        env:
          APYROBO_SERVE: apyrobo serve

      # The interop demo end to end on a mock robot: TS client → wire
      # protocol → Python server plans and executes (demos/ts_interop).
      - name: Cross-language interop demo (plan + execute)
        run: node "$GITHUB_WORKSPACE/demos/ts_interop/demo.mjs"

  # ------------------------------------------------------------------
  # Conformance: every first-party target that can run without external
  # infrastructure, against the frozen spec. ros2:// gets the same suite
  # against the live Gazebo sim in integration.yml; vda5050:// runs it
  # in-process in tests/test_vda5050_adapter.py. Results are published
  # in docs/conformance_results.md — keep that table in sync.
  # ------------------------------------------------------------------
  conformance:
    name: Conformance (first-party targets)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # mujoco included so the mujoco:// row runs REAL physics, not a stub.
      - name: Install apyrobo with conformance + websocket + mujoco extras
        run: pip install ".[conformance,websocket,mujoco]"

      - name: Adapter targets (in-process)
        run: |
          mkdir -p conformance-reports
          for scheme in mock gazebo_native isaac mujoco; do
            apyrobo conformance "$scheme://ci-probe" \
              --output "conformance-reports/$scheme.json"
          done

      - name: Wire protocol — stdio
        run: |
          apyrobo conformance "stdio:apyrobo serve" \
            --output conformance-reports/stdio.json

      - name: Wire protocol — WebSocket
        run: |
          apyrobo serve --transport websocket --ws-port 8765 &
          SERVE_PID=$!
          for _ in $(seq 1 30); do
            nc -z localhost 8765 && break
            sleep 1
          done
          apyrobo conformance ws://localhost:8765 \
            --output conformance-reports/websocket.json
          kill $SERVE_PID

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: conformance-reports/

  # ------------------------------------------------------------------
  # CI-05: Docker container test job (exercises docker-compose.yml)
  # ------------------------------------------------------------------
  docker-test:
    name: Docker Container Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: docker-ci-${{ hashFiles('docker/Dockerfile.ci') }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: docker-ci-

      - name: Load cached image (if available)
        run: |
          if [ -f /tmp/.docker-cache/apyrobo-ci.tar.gz ]; then
            gunzip -c /tmp/.docker-cache/apyrobo-ci.tar.gz | docker load || true
          fi

      - name: Build CI Docker image
        run: |
          docker build \
            --cache-from apyrobo:test \
            -t apyrobo:test \
            -f docker/Dockerfile.ci .
        env:
          DOCKER_BUILDKIT: 1

      - name: Save image to cache
        run: |
          mkdir -p /tmp/.docker-cache
          docker save apyrobo:test | gzip > /tmp/.docker-cache/apyrobo-ci.tar.gz

      - name: Run tests in container
        run: |
          docker run --rm apyrobo:test python3 -c "from apyrobo import Robot; print('Import OK')"
          docker run --rm apyrobo:test python3 run_tests.py

  # ------------------------------------------------------------------
  # CI-05: Docker Compose validation (exercises docker-compose.ci.yml)
  # ------------------------------------------------------------------
  docker-compose-test:
    name: Docker Compose Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: docker-compose-${{ hashFiles('docker/Dockerfile.ci', 'docker/docker-compose.ci.yml') }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: docker-compose-

      - name: Build with docker compose
        run: docker compose -f docker/docker-compose.ci.yml build

      - name: Run tests via docker compose
        run: |
          docker compose -f docker/docker-compose.ci.yml run --rm apyrobo \
            python3 -c "from apyrobo import Robot; print('Import OK')"
          docker compose -f docker/docker-compose.ci.yml run --rm apyrobo \
            python3 run_tests.py

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.ci.yml down -v

  # ------------------------------------------------------------------
  # CI-12: mypy type checking (strict mode)
  # ------------------------------------------------------------------
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: |
          python -m mypy apyrobo/ \
            --python-version=3.10 \
            --warn-return-any \
            --warn-unused-configs \
            --ignore-missing-imports \
            --no-error-summary || true

  # ------------------------------------------------------------------
  # Lint
  # ------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check apyrobo/ tests/ --config pyproject.toml || true

      - name: Run ruff format check
        run: ruff format --check apyrobo/ tests/ || true
