# =============================================================================
# APYROBO Docker Compose — Production / Cloud Environment
#
# Quick start (API only):
#   cp docker/.env.example docker/.env
#   docker compose -f docker/docker-compose.yml up -d
#
#
# With Redis:
#   docker compose -f docker/docker-compose.yml --profile redis up -d
#
# With Prometheus only:
#   docker compose -f docker/docker-compose.yml --profile monitoring up -d
#   → Prometheus UI: http://localhost:9090
#
# With full observability (Prometheus + Grafana):
#   docker compose -f docker/docker-compose.yml --profile observability up -d
#   → Grafana: http://localhost:3000  (admin / apyrobo)
#   → Prometheus: http://localhost:9090
#
#
# Integration tests (fake-robot + pytest):
#   docker compose -f docker/docker-compose.yml --profile integration up \
#       --abort-on-container-exit --exit-code-from integration-test
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # REST API gateway
  # ---------------------------------------------------------------------------
  apyrobo-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: apyrobo:latest
    container_name: apyrobo-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APYROBO_API_KEY: ${APYROBO_API_KEY:-changeme}
      APYROBO_LOG_LEVEL: ${APYROBO_LOG_LEVEL:-INFO}
      APYROBO_REDIS_URL: ${APYROBO_REDIS_URL:-}
      APYROBO_AUDIT_DB: /app/data/audit/audit.db
    volumes:
      - audit_data:/app/data/audit
      - skill_data:/app/data/skills
    networks:
      - apyrobo-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
        required: false

  # ---------------------------------------------------------------------------
  # Redis — optional state persistence (profile: redis)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: apyrobo-redis
    restart: unless-stopped
    profiles:
      - redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - apyrobo-net
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # Prometheus — metrics scraping (profile: monitoring)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: apyrobo-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - apyrobo-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

  # ---------------------------------------------------------------------------
  # Grafana — dashboards (profile: observability)
  #
  # Provisioned automatically:
  #   datasource: Prometheus at http://prometheus:9090
  #   dashboard:  docker/grafana/provisioning/dashboards/apyrobo.json
  #
  # Open: http://localhost:3000  (admin / apyrobo)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: apyrobo-grafana
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: apyrobo
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - apyrobo-net
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # Integration test — profile: integration
  #
  # fake-robot: minimal ROS 2 node that simulates a TurtleBot4.
  # integration-test: runs pytest -m integration inside the same ROS domain.
  #
  # Both containers share ROS_DOMAIN_ID=42 and the ros2-test-net bridge.
  # FastDDS multicast discovery works on Linux Docker bridge networks.
  # If discovery fails (e.g. Docker Desktop on Mac), set network_mode: host
  # on both services and remove the networks: stanza from each.
  #
  # Run:
  #   docker compose -f docker/docker-compose.yml --profile integration \
  #       up --build --abort-on-container-exit
  # ---------------------------------------------------------------------------
  fake-robot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.integration
    image: apyrobo-integration:latest
    container_name: apyrobo-fake-robot
    profiles:
      - integration
    networks:
      - ros2-test-net
    environment:
      ROS_DOMAIN_ID: "42"
    command:
      - python3
      - tests/integration/fake_turtlebot4.py
    healthcheck:
      # Receive one /odom message (proves the node is up and publishing).
      # ros2 topic hz does not support --once; use topic echo --once instead.
      # timeout 5 ensures the command doesn't hang if the node isn't up yet.
      test:
        - CMD
        - bash
        - -c
        - "source /opt/ros/humble/setup.bash && timeout 5 ros2 topic echo /odom --once > /dev/null 2>&1"
      interval: 10s
      timeout: 15s
      retries: 8
      start_period: 30s

  integration-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.integration
    image: apyrobo-integration:latest
    container_name: apyrobo-integration-test
    profiles:
      - integration
    networks:
      - ros2-test-net
    environment:
      ROS_DOMAIN_ID: "42"
      FAKE_ROBOT_EXTERNAL: "1"
    depends_on:
      fake-robot:
        condition: service_healthy
    command:
      - pytest
      - -m
      - integration
      - tests/integration/
      - -v
      - --tb=short

  # Gazebo integration — profile: gazebo
  #
  # gazebo-sim:  headless Gazebo Classic running a physics-simulated
  #              TurtleBot3 burger (real diff-drive: /cmd_vel → /odom).
  # gazebo-test: runs the real ros2:// adapter against it and asserts the
  #              robot actually moves.
  #
  # Proves APYROBO drives a physics-simulated robot, not the kinematic
  # fake_turtlebot4 node. Same shared-domain / bridge-network setup as the
  # integration profile (use network_mode: host on Docker Desktop for Mac).
  #
  #   docker compose -f docker/docker-compose.yml --profile gazebo up \
  #       --build --abort-on-container-exit --exit-code-from gazebo-test
  # ---------------------------------------------------------------------------
  gazebo-sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gazebo
    image: apyrobo-gazebo:latest
    container_name: apyrobo-gazebo-sim
    profiles:
      - gazebo
    networks:
      - ros2-test-net
    environment:
      ROS_DOMAIN_ID: "42"
      TURTLEBOT3_MODEL: "burger"
    command:
      - bash
      - tests/integration/gazebo_boot.sh
    healthcheck:
      # Robot is up once /odom flows from the Gazebo diff-drive plugin.
      test:
        - CMD
        - bash
        - -c
        - "source /opt/ros/humble/setup.bash && timeout 5 ros2 topic echo /odom --once > /dev/null 2>&1"
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 60s

  gazebo-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gazebo
    image: apyrobo-gazebo:latest
    container_name: apyrobo-gazebo-test
    profiles:
      - gazebo
    networks:
      - ros2-test-net
    environment:
      ROS_DOMAIN_ID: "42"
      # Opt-in for the Gazebo tests. Only set here — never in the plain
      # 'integration' job — so those tests never run against the fake robot.
      APYROBO_GAZEBO: "1"
    depends_on:
      gazebo-sim:
        condition: service_healthy
    # After the integration tests, the conformance suite runs against the
    # same live physics robot — docs/conformance_results.md cites this run.
    # rclpy can segfault at interpreter teardown AFTER the report is
    # written, so the verdict comes from the JSON report, not the exit code.
    command:
      - bash
      - -c
      - >-
        pytest -p "no:launch_testing" -m integration -k gazebo
        tests/integration/test_gazebo_turtlebot.py -v --tb=short
        && { apyrobo conformance ros2://burger --output /tmp/conf.json || true; }
        && python3 -c "import json,sys; r=json.load(open('/tmp/conf.json'));
        print('ros2:// conformant:', r['conformant']);
        sys.exit(0 if r['conformant'] else 1)"

  # ---------------------------------------------------------------------------
  # Nav2 end-to-end — profile: gazebo-nav
  #
  # gazebo-nav-sim:  the gazebo-sim setup plus robot_state_publisher and the
  #                  full Nav2 stack in SLAM mode (slam_toolbox, live map).
  # gazebo-nav-test: the flagship-stack proof — a natural-language task is
  #                  planned by the rule agent and executed through Nav2
  #                  NavigateToPose; asserts the physics robot reaches the
  #                  goal region.
  #
  #   docker compose -f docker/docker-compose.yml --profile gazebo-nav up \
  #       --build --abort-on-container-exit --exit-code-from gazebo-nav-test
  # ---------------------------------------------------------------------------
  gazebo-nav-sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gazebo
    image: apyrobo-gazebo:latest
    container_name: apyrobo-gazebo-nav-sim
    profiles:
      - gazebo-nav
      - gazebo-nav-interop
    networks:
      - ros2-test-net
    environment:
      ROS_DOMAIN_ID: "42"
      TURTLEBOT3_MODEL: "burger"
    command:
      - bash
      - tests/integration/gazebo_nav_boot.sh
    healthcheck:
      # Ready once the NavigateToPose action server is live AND slam_toolbox
      # has published a map. The action server alone races SLAM startup: a
      # goal accepted before the map frame exists leaves Nav2 unable to
      # drive the robot (seen as "Δ=0.00 m" e2e failures on fast runners).
      test:
        - CMD
        - bash
        - -c
        - "source /opt/ros/humble/setup.bash && ros2 action list 2>/dev/null | grep -q navigate_to_pose && timeout 10 ros2 topic echo /map --once >/dev/null 2>&1"
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 120s

  gazebo-nav-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gazebo
    image: apyrobo-gazebo:latest
    container_name: apyrobo-gazebo-nav-test
    profiles:
      - gazebo-nav
    networks:
      - ros2-test-net
    environment:
      ROS_DOMAIN_ID: "42"
      # Opt-in for the Nav2 e2e tests only (mirrors APYROBO_GAZEBO).
      APYROBO_GAZEBO_NAV: "1"
    depends_on:
      gazebo-nav-sim:
        condition: service_healthy
    command:
      - pytest
      - -p
      - "no:launch_testing"
      - -m
      - integration
      - tests/integration/test_gazebo_nav2_e2e.py
      - -v
      - --tb=short

  # Cross-language interop showcase (demos/ts_interop): the wire-protocol
  # server in execute mode against the live Nav2 sim, WebSocket exposed to
  # the host so the TypeScript client can drive the robot from outside the
  # ROS world:
  #   docker compose -f docker/docker-compose.yml --profile gazebo-nav-interop up -d
  #   node demos/ts_interop/demo.mjs --ws ws://localhost:8765 \
  #       --robot ros2://burger --task "navigate to (-1.2, -0.5)"
  # Own profile so the gazebo-nav CI e2e job doesn't fight it for the robot.
  gazebo-nav-serve:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gazebo
    image: apyrobo-gazebo:latest
    container_name: apyrobo-gazebo-nav-serve
    profiles:
      - gazebo-nav-interop
    networks:
      - ros2-test-net
    environment:
      ROS_DOMAIN_ID: "42"
    ports:
      - "8765:8765"
    depends_on:
      gazebo-nav-sim:
        condition: service_healthy
    command:
      - apyrobo
      - serve
      - --transport
      - websocket
      - --execute
      - --robot
      - ros2://burger

  # Narrated demo run against the live gazebo-nav sim (used by
  # demos/nav2_gazebo/record.sh and the Demo Recording workflow):
  #   docker compose --profile gazebo-nav run --rm gazebo-nav-demo
  # (`run` auto-activates this service's own profile.) Deliberately NOT in
  # the gazebo-nav profile: `--profile gazebo-nav up` is the CI e2e job, and
  # a demo container started alongside the test would fight it for the robot
  # and abort the run when it exits first.
  gazebo-nav-demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gazebo
    image: apyrobo-gazebo:latest
    profiles:
      - gazebo-nav-demo
    networks:
      - ros2-test-net
    environment:
      ROS_DOMAIN_ID: "42"
    depends_on:
      gazebo-nav-sim:
        condition: service_healthy
    command:
      - python3
      - demos/nav2_gazebo/demo.py

volumes:
  audit_data:
    driver: local
  skill_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  apyrobo-net:
    driver: bridge
  ros2-test-net:
    driver: bridge
