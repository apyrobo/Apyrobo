# =============================================================================
# APYROBO demo environment (mock robots, no ROS or Gazebo)
#
# Quick start:
#   docker compose -f docker/docker-compose-demo.yml up
#   → Dashboard: http://localhost:8000
#   → Orchestration server (wire protocol over WebSocket): ws://localhost:8765
# =============================================================================

services:

  apyrobo-demo:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      PYTHONPATH: /app
      APYROBO_LOG_LEVEL: INFO
      APYROBO_DEMO: "1"
    command: >
      sh -c "pip install -e /app[websocket] -q &&
             apyrobo serve --robot mock://turtlebot4 --provider rule --transport websocket --ws-port 8765 --execute"
    ports:
      - "8765:8765"
    restart: unless-stopped

  dashboard:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      PYTHONPATH: /app
      APYROBO_LOG_LEVEL: INFO
      APYROBO_DEMO: "1"
    command: >
      sh -c "pip install -e /app[dashboard] -q &&
             apyrobo dashboard --port 8000 --robot mock://turtlebot4"
    ports:
      - "8000:8000"
    depends_on:
      - apyrobo-demo
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim has no curl; use the interpreter that is there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mock-fleet:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      PYTHONPATH: /app
      APYROBO_DEMO: "1"
    command: >
      sh -c "pip install -e /app[dashboard] -q &&
             python -m apyrobo.demo.mock_fleet"
    restart: unless-stopped
