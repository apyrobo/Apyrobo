name: ROS 2 Integration Tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same ref when a new one starts.
concurrency:
  group: ros2-integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros2-integration:
    name: ROS 2 Adapter Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build the integration image.
      # We intentionally skip tar-based image caching: loading a stale image
      # via docker load can cause Docker to reuse old layers and miss apt
      # package changes (e.g. ros-humble-rclpy submodule updates).
      # BuildKit layer caching via the Docker daemon still applies.
      - name: Build integration image
        run: docker compose -f docker/docker-compose.yml --profile integration build
        env:
          DOCKER_BUILDKIT: 1

      # --exit-code-from propagates pytest's exit code to this step.
      # It implies --abort-on-container-exit, so the fake-robot service is
      # stopped as soon as the integration-test container finishes.
      - name: Run integration tests
        run: |
          docker compose -f docker/docker-compose.yml --profile integration \
            up \
            --abort-on-container-exit \
            --exit-code-from integration-test
        env:
          DOCKER_BUILDKIT: 1

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --profile integration logs

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml --profile integration down --volumes

  # Real-physics proof: the same ros2:// adapter, driven against a
  # TurtleBot3 in headless Gazebo Classic (not the kinematic fake robot).
  # Gazebo-in-CI is heavy; a generous timeout guards against hung boots.
  gazebo-integration:
    name: Gazebo TurtleBot3 Integration
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Build Gazebo image
        run: docker compose -f docker/docker-compose.yml --profile gazebo build
        env:
          DOCKER_BUILDKIT: 1

      - name: Run Gazebo integration test
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo \
            up \
            --abort-on-container-exit \
            --exit-code-from gazebo-test
        env:
          DOCKER_BUILDKIT: 1

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo logs

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml --profile gazebo down --volumes
