[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "apyrobo"
version = "4.0.0"
description = "Open-source AI orchestration layer for robotics, built on ROS 2"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "APYROBO Contributors" }]
keywords = ["robotics", "ros2", "ai", "llm", "swarm", "orchestration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "hypothesis>=6.0",
    "jsonschema>=4.21",     # spec/schemas drift-guard tests
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
registry = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
websocket = [
    "websockets>=13.0",   # modern asyncio API (websockets.asyncio.*)
]
slack = [
    "slack-bolt>=1.18",
]
llm = [
    "litellm>=1.0",        # Model-agnostic LLM/VLM interface
]
conformance = [
    "jsonschema>=4.21",    # schema-validation checks in `apyrobo conformance`
]
full = [
    "apyrobo[llm,api,registry,dashboard,websocket,slack,conformance]",
]
ros = [
    # ROS 2 deps are installed system-wide via apt in Docker
    # This is a placeholder for any pip-installable ROS bridges
]

[project.scripts]
apyrobo = "apyrobo.cli:main"

[project.urls]
Homepage = "https://github.com/apyrobo/Apyrobo"
Documentation = "https://github.com/apyrobo/Apyrobo/tree/main/docs"
Repository = "https://github.com/apyrobo/Apyrobo"
Issues = "https://github.com/apyrobo/Apyrobo/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["apyrobo*"]

[tool.setuptools.package-data]
# Copies of spec/schemas/ shipped for `apyrobo conformance`; the drift test
# in tests/test_spec_schemas.py keeps them byte-identical to the spec.
"apyrobo.conformance" = ["schemas/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=apyrobo --cov-report=term-missing -v"
markers = [
    "integration: end-to-end tests that require ROS 2 Humble and a running fake robot (opt-in with -m integration)",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
